<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peak Pilates 綜合練習測驗（中英對照）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F1EB;--paper-2:#FBF9F5;--ink:#2B2E2C;--ink-soft:#6A6F69;
    --sage:#728A6F;--sage-deep:#4F6450;--clay:#C0795A;--line:#E2DDD2;
    --good:#3F7A52;--good-bg:#E6F0E8;--bad:#B5503F;--bad-bg:#F6E5E0;--radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;padding:0 0 80px}
  .wrap{max-width:680px;margin:0 auto;padding:0 18px}

  header{padding:34px 18px 26px;border-bottom:1px solid var(--line);
    background:radial-gradient(120% 80% at 100% 0%, rgba(114,138,111,.10), transparent 60%),var(--paper)}
  .eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage-deep);font-weight:700;margin-bottom:10px}
  h1{font-family:"Fraunces",serif;font-weight:500;font-size:clamp(28px,7vw,40px);line-height:1.1;letter-spacing:-.01em}
  h1 em{font-style:italic;color:var(--clay)}
  .sub{color:var(--ink-soft);margin-top:10px;font-size:15px}

  .controls{display:flex;flex-wrap:wrap;gap:14px 18px;padding:16px 18px 2px;font-size:13px;color:var(--ink-soft)}
  .controls label{display:flex;align-items:center;gap:8px;cursor:pointer}
  .controls input{width:16px;height:16px;accent-color:var(--sage-deep)}

  .bar{position:sticky;top:0;z-index:5;background:rgba(244,241,235,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px}
  .progress{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s ease}
  .score{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

  .q{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;margin-top:16px}
  .qnum{font-family:"Fraunces",serif;font-size:13px;color:var(--clay);font-weight:600;letter-spacing:.04em;
    margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .qsrc{font-family:"Noto Sans TC",sans-serif;font-size:11px;color:var(--ink-soft);font-weight:500;
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .qtext{font-size:16px;font-weight:500;margin-bottom:3px}
  .qtext-zh{font-size:14px;color:var(--sage-deep);margin-bottom:14px}
  .opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:11px;
    padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:border-color .15s ease,background .15s ease}
  .opt:hover{border-color:var(--sage)}
  .opt .key{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-soft);color:var(--ink-soft);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .opt .label{flex:1;font-size:14px}
  .opt .label .zh{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:1px}
  .opt.sel{border-color:var(--sage-deep)}
  .opt.sel .key{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff}
  .answered .opt{cursor:default;pointer-events:none}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.correct .key{background:var(--good);border-color:var(--good);color:#fff}
  .opt.correct .label .zh{color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
  .opt.wrong .label .zh{color:var(--bad)}

  .explain{margin-top:6px;border-left:3px solid var(--sage);background:#fff;border-radius:0 10px 10px 0;
    padding:11px 14px;font-size:13.5px;color:var(--ink);display:none}
  .answered .explain{display:block}
  .explain .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-bottom:6px}
  .tag.ok{background:var(--good-bg);color:var(--good)}
  .tag.no{background:var(--bad-bg);color:var(--bad)}
  .prev{font-size:12px;color:var(--ink-soft);margin-top:7px}
  .prev b{color:var(--bad)}

  .result{background:var(--sage-deep);color:#fff;border-radius:var(--radius);padding:22px 20px;margin-top:20px;display:none}
  .result.show{display:block}
  .result h2{font-family:"Fraunces",serif;font-weight:500;font-size:24px;margin-bottom:4px}
  .result p{opacity:.9;font-size:14px}
  .result .big{font-family:"Fraunces",serif;font-size:46px;line-height:1;margin:8px 0}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:14px;font-weight:500;border-radius:999px;padding:12px 22px;cursor:pointer;
    border:1px solid var(--sage-deep);background:var(--sage-deep);color:#fff;transition:opacity .15s ease}
  .btn:hover{opacity:.88}
  .btn.ghost{background:transparent;color:var(--sage-deep)}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;padding:30px 18px 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="eyebrow">Peak Pilates · Classical Level I Mat</div>
    <h1>綜合<em>練習</em>測驗</h1>
    <p class="sub">四份測驗全部混合、隨機出題，共 <span id="totalCount">0</span> 題，中英對照、附解析。</p>
  </div>
</header>

<div class="controls">
  <label><input type="checkbox" id="shuffleOpt" checked> 打散選項順序</label>
</div>

<div class="bar">
  <div class="progress"><i id="prog"></i></div>
  <div class="score" id="score">0 / 0</div>
</div>

<main class="wrap" id="quiz"></main>

<div class="wrap">
  <div class="result" id="result">
    <h2 id="rTitle">完成！</h2>
    <div class="big" id="rScore">0 / 0</div>
    <p id="rMsg"></p>
  </div>
  <div class="actions">
    <button class="btn" id="retry">重新打亂一份</button>
    <button class="btn ghost" id="showAll">直接看全部正解</button>
  </div>
</div>

<footer class="wrap">依據專案教材整理 · 僅供個人練習複習</footer>

document.getElementById('totalCount').textContent=RAW.length;

let pool=[], state=[];
const quizEl=document.getElementById('quiz');
const scoreEl=document.getElementById('score');
const progEl=document.getElementById('prog');
const resultEl=document.getElementById('result');

function shuffle(arr){
  const a=arr.slice();
  for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}
  return a;
}

/* 偵測「指涉其他選項」的題目（A & C、Both A and B、A or B、All/None of the above），這類不打散順序 */
const REF=/\b(?:both\s+)?[A-D]\s*(?:&|and|or)\s*[A-D]\b|above\b/i;
function isLocked(it){return it.o.some(o=>REF.test(o));}

function render(){
  resultEl.classList.remove('show');
  quizEl.innerHTML='';
  const doOpt=document.getElementById('shuffleOpt').checked;
  pool=shuffle(RAW);
  state=pool.map(it=>{
    const keepOrder = !doOpt || isLocked(it);
    const order = keepOrder ? it.o.map((v,i)=>({i})) : shuffle(it.o.map((v,i)=>({i})));
    return {answered:false,chosen:null,order};
  });
  pool.forEach((it,qi)=>{
    const card=document.createElement('div');
    card.className='q';card.id='q'+qi;
    let opts='';
    state[qi].order.forEach((op,di)=>{
      const letter=String.fromCharCode(65+di);
      opts+=`<div class="opt" data-q="${qi}" data-orig="${op.i}"><div class="key">${letter}</div>
        <div class="label">${it.o[op.i]}<span class="zh">${it.oz[op.i]}</span></div></div>`;
    });
    const lockBadge=(doOpt && isLocked(it))?`<span class="qsrc" style="border-color:var(--clay);color:var(--clay)">選項固定</span>`:'';
    card.innerHTML=`<div class="qnum"><span>第 ${qi+1} 題</span><span style="display:flex;gap:6px">${lockBadge}<span class="qsrc">${it.src}</span></span></div>
      <div class="qtext">${it.q}</div><div class="qtext-zh">${it.qz}</div>${opts}<div class="explain"></div>`;
    quizEl.appendChild(card);
  });
  quizEl.querySelectorAll('.opt').forEach(o=>o.onclick=onPick);
  updateScore();
  window.scrollTo({top:0,behavior:'smooth'});
}

function onPick(e){
  const el=e.currentTarget, qi=+el.dataset.q;
  if(state[qi].answered)return;
  const orig=+el.dataset.orig;
  state[qi].answered=true;state[qi].chosen=orig;
  const it=pool[qi], card=document.getElementById('q'+qi);
  card.classList.add('answered');
  card.querySelectorAll('.opt').forEach(opt=>{
    const oi=+opt.dataset.orig;
    if(oi===it.correct)opt.classList.add('correct');
    if(oi===orig&&orig!==it.correct)opt.classList.add('wrong');
    if(oi===orig)opt.classList.add('sel');
  });
  const ok=orig===it.correct;
  let prev='';
  if(it.picked!=null && it.picked!==it.correct){prev=`<div class="prev">你截圖中原本選了：<b>${it.o[it.picked]}（${it.oz[it.picked]}）</b></div>`;}
  card.querySelector('.explain').innerHTML=`<span class="tag ${ok?'ok':'no'}">${ok?'答對':'答錯'}</span><div>${it.ex}</div>${prev}`;
  updateScore();
}

function updateScore(){
  const total=pool.length;let done=0,right=0;
  state.forEach((s,i)=>{if(s.answered){done++;if(s.chosen===pool[i].correct)right++;}});
  scoreEl.textContent=`${right} / ${total}`;
  progEl.style.width=(done/total*100)+'%';
  if(done===total)finish(right,total);
}

function finish(right,total){
  resultEl.classList.add('show');
  document.getElementById('rScore').textContent=`${right} / ${total}`;
  const pct=Math.round(right/total*100);
  document.getElementById('rTitle').textContent=pct>=80?'做得很好！':'再複習一下';
  document.getElementById('rMsg').textContent=`正確率 ${pct}%`;
  resultEl.scrollIntoView({behavior:'smooth',block:'nearest'});
}

document.getElementById('shuffleOpt').onchange=render;
document.getElementById('retry').onclick=render;
document.getElementById('showAll').onclick=()=>{
  pool.forEach((it,qi)=>{
    if(!state[qi].answered){
      const card=document.getElementById('q'+qi);
      const opt=[...card.querySelectorAll('.opt')].find(o=>+o.dataset.orig===it.correct);
      if(opt)opt.click();
    }
  });
};

render();
</script>
